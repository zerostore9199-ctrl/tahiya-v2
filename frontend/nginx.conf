# Serves the Angular PWA and proxies /api to the Spring Boot backend replicas.
# TLS terminates here (camera access requires HTTPS on phones). Global settings live in nginx-main.conf.
server {
    listen 8080;
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1h;

    # Plain HTTP only redirects to HTTPS.
    if ($scheme = http) { return 301 https://$host:${HTTPS_PUBLIC_PORT}$request_uri; }

    include /etc/nginx/security-headers.conf;

    root /usr/share/nginx/html;

    # Docker's DNS returns every backend replica; using a variable makes nginx re-resolve every few
    # seconds (so restarted or added replicas are picked up) and round-robin across all addresses.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # A replica that is restarting is skipped. PUT/POST are never re-sent after they reached a
        # backend (nginx's default for non-idempotent methods), so nothing is recorded twice.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location = /ngsw.json { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.html { include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
    location ~* \.(js|css|woff2?|svg|png|jpe?g|webp|ico)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable" always;
        expires 30d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}
