server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:400}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:25}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:10000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:500}
    connection-timeout: 20s
    keep-alive-timeout: 30s
  error:
    include-stacktrace: never
    include-message: never
  forward-headers-strategy: framework

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: attendance-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/attendance}
    username: ${DB_USER:attendance}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:40}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 10000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  zone: ${APP_ZONE:Asia/Muscat}
  cors-origins: ${CORS_ORIGINS:http://localhost:4200}
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: ${ACCESS_TOKEN_MINUTES:30}
    refresh-token-days: ${REFRESH_TOKEN_DAYS:7}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:true}
    max-failed-logins: ${MAX_FAILED_LOGINS:5}
    lockout-minutes: ${LOCKOUT_MINUTES:15}
    ip-login-attempts-per-minute: ${IP_LOGIN_ATTEMPTS_PER_MINUTE:20}
  biometric:
    # Base64 of 32 random bytes (AES-256). Generate: openssl rand -base64 32
    encryption-key: ${BIOMETRIC_ENC_KEY:}
  face-service:
    url: ${FACE_SERVICE_URL:http://localhost:8000}
    api-key: ${FACE_API_KEY:}
    timeout-seconds: ${FACE_SERVICE_TIMEOUT_SECONDS:30}
  reports:
    # TTF font with Arabic glyphs used for PDF exports
    pdf-font-path: ${PDF_FONT_PATH:/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf}
  demo:
    enabled: ${DEMO_DATA_ENABLED:false}
    password: ${DEMO_PASSWORD:}

logging:
  level:
    root: INFO
    om.mtc.attendance: INFO

---
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
